<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital D20</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121225;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    body {
    background: linear-gradient(-45deg, #1a1a3d, #2d2d6a, #3742fa, #6c5ce7);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  

    #dice-container {
      perspective: 1000px;
      width: 150px;
      height: 150px;
      margin-bottom: 1rem;
    }

    .die {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #292961, #1a1a3d);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      color: #ffda79;
      transform-style: preserve-3d;
      transition: transform 1s ease-in-out;
    }

    button {
      background: #3742fa;
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #5352ed;
    }

    #message {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: #ffa502;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🎲 Digital D20 Die</h1>
  <h2>Roll with honor</h2>
  <div id="dice-container">
    <div id="die" class="die">–</div>
  </div>
  <button onclick="rollD20()">Roll D20</button>
  <div id="message"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const die = document.getElementById('die');
    const message = document.getElementById('message');

    const messages = {
      1: "Critical Failure! Did you roll with your eyes closed?",
      2: "Oof. Better luck next time.",
      3: "That die really said 'nope'.",
      4: "Not great, not terrible. Mostly terrible.",
      5: "Mediocrity at its finest.",
      6: "This could have gone better.",
      7: "You're warming up... maybe.",
      8: "At least it's not a 1.",
      9: "Still under 10. Womp womp.",
      10: "You're halfway to greatness.",
      11: "Over the hill, barely.",
      12: "A decent roll!",
      13: "Unlucky for some, lucky for you?",
      14: "You're getting there.",
      15: "Respectable!",
      16: "That's a spicy number.",
      17: "Hot stuff!",
      18: "Nearly perfect!",
      19: "So close you can taste it.",
      20: "🎉 CRITICAL SUCCESS! The gods are with you!"
    };

    function rollD20() {
      const roll = Math.floor(Math.random() * 20) + 1;
      const spinX = Math.floor(Math.random() * 360) + 720;
      const spinY = Math.floor(Math.random() * 360) + 720;

      die.style.transition = "transform 0.6s ease-in-out";
      die.style.transform = "rotateX(" + spinX + "deg) rotateY(" + spinY + "deg)";

      setTimeout(() => {
        die.textContent = roll;
        die.style.transition = "transform 0.3s ease-in-out";
        die.style.transform = "rotateX(0deg) rotateY(0deg)";

        message.textContent = messages[roll] || "";

        if (roll === 20) {
          confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      }, 600);
    }
  </script>
</body>
</html>
